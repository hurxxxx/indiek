# Install as /etc/logrotate.d/indiek. The subdirectory avoids nginx's *.log rule.
/var/log/nginx/indiek/access.log {
    daily
    rotate 29
    maxage 30
    missingok
    ifempty
    compress
    delaycompress
    su root adm
    create 0640 www-data adm
    sharedscripts
    postrotate
        invoke-rc.d nginx rotate >/dev/null 2>&1
    endscript
}
