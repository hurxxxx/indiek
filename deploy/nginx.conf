# Install as /etc/nginx/sites-available/indiek.com after issuing the certificate.
# Only dist/ is a web root; Git metadata and source files are not served.
# The existing host defines TLS/HTTP2 on the shared IPv4/IPv6 :443 sockets.
# Inherit those socket options, as the other virtual hosts do.
# This file is included in the http context. Keep the original path without queries.
map $request_uri $indiek_log_path {
    default "";
    ~^(?<indiek_path_without_query>[^?]*) $indiek_path_without_query;
}
log_format indiek_access escape=json
    '{"time":"$time_iso8601","ip":"$remote_addr",'
    '"host":"$host","scheme":"$scheme","method":"$request_method",'
    '"path":"$indiek_log_path","status":$status,"bytes":$body_bytes_sent,'
    '"duration":$request_time,"user_agent":"$http_user_agent"}';

# No client address or User-Agent in the API log. Reuses $indiek_log_path (path without query).
log_format indiek_api escape=json
    '{"time":"$time_iso8601","method":"$request_method","path":"$indiek_log_path",'
    '"status":$status,"bytes":$body_bytes_sent,"duration":$request_time,'
    '"upstream":"$upstream_response_time","cache":"$upstream_cache_status"}';

# Participation API (indiek-api on 127.0.0.1:8787). Pages never depend on /api/: while the
# service is down, /api/ answers JSON 503 (or the last cached results).
# 5-second micro-cache for poll results only. Nginx creates the directory itself; its parent
# /var/cache always exists, so installing this file never depends on the API being set up.
proxy_cache_path /var/cache/nginx-indiek-api levels=1:2 keys_zone=indiek_api:1m
                 max_size=16m inactive=10m use_temp_path=off;

# Coarse flood guard for writes. The API applies its own per-address limits.
# Addresses exist only in Nginx shared memory here; they are not logged.
map $request_method $indiek_api_write_key {
    POST    $binary_remote_addr;
    default "";
}
limit_req_zone $indiek_api_write_key zone=indiek_api_write:1m rate=30r/m;

server {
    listen 80;
    listen [::]:80;
    server_name indiek.com www.indiek.com;
    access_log /var/log/nginx/indiek/access.log indiek_access;
    error_log /var/log/nginx/indiek.error.log warn;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }
    location / { return 301 https://indiek.com$request_uri; }
}

server {
    listen 443;
    listen [::]:443;
    server_name www.indiek.com;
    ssl_certificate /etc/letsencrypt/live/indiek.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/indiek.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    access_log /var/log/nginx/indiek/access.log indiek_access;
    error_log /var/log/nginx/indiek.error.log warn;
    return 301 https://indiek.com$request_uri;
}

server {
    listen 443;
    listen [::]:443;
    server_name indiek.com;
    root /projects/indiek/dist;
    index index.html;
    autoindex off;
    server_tokens off;

    ssl_certificate /etc/letsencrypt/live/indiek.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/indiek.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    access_log /var/log/nginx/indiek/access.log indiek_access;
    error_log /var/log/nginx/indiek.error.log warn;
    gzip_vary on;
    gzip_min_length 256;
    gzip_types text/css application/javascript application/json application/xml text/plain image/svg+xml;

    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;
    add_header Strict-Transport-Security "max-age=86400" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://matomo.lumejs.com https://www.youtube.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://matomo.lumejs.com; font-src 'self'; frame-src https://www.youtube-nocookie.com https://www.youtube.com; connect-src 'self' https://matomo.lumejs.com; object-src 'none'; base-uri 'self'; form-action 'none'; frame-ancestors 'none'; upgrade-insecure-requests" always;

    location ^~ /api/ {
        access_log /var/log/nginx/indiek/api.log indiek_api;
        limit_req zone=indiek_api_write burst=10 nodelay;
        limit_req_status 429;
        # Below the site's `error_log ... warn`, so refusals do not write client addresses.
        limit_req_log_level info;
        client_max_body_size 8k;

        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Connection "";
        proxy_set_header Cookie "";
        proxy_set_header Authorization "";
        proxy_connect_timeout 2s;
        proxy_send_timeout 5s;
        proxy_read_timeout 10s;
        # Browsers get the server-level Cache-Control: no-cache.
        proxy_hide_header Cache-Control;
        error_page 502 503 504 = @indiek_api_unavailable;
        error_page 429 = @indiek_api_rate_limited;

        location ~ ^/api/polls/[a-z0-9-]+/results$ {
            limit_except GET { deny all; }
            proxy_pass http://127.0.0.1:8787;
            proxy_cache indiek_api;
            proxy_cache_key $uri;
            proxy_ignore_headers Cache-Control Expires Set-Cookie;
            proxy_cache_valid 200 404 5s;
            proxy_cache_lock on;
            proxy_cache_lock_timeout 2s;
            proxy_cache_background_update on;
            proxy_cache_use_stale updating error timeout http_502 http_503 http_504;
        }
    }

    location @indiek_api_unavailable {
        access_log /var/log/nginx/indiek/api.log indiek_api;
        default_type application/json;
        return 503 '{"error":"unavailable"}';
    }

    location @indiek_api_rate_limited {
        access_log /var/log/nginx/indiek/api.log indiek_api;
        default_type application/json;
        add_header Retry-After 60 always;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
        return 429 '{"error":"rate_limited"}';
    }

    # Ubuntu's default mime.types does not include ES module .mjs files.
    location ~ \.mjs$ {
        types { application/javascript mjs; }
        try_files $uri =404;
    }
    location ~ /\. { deny all; }
    location / { try_files $uri $uri/ =404; }
}
