# Install as /etc/nginx/sites-available/indiek.com after issuing the certificate.
# Only dist/ is a web root; Git metadata and source files are not served.
# The existing host defines TLS/HTTP2 on the shared IPv4/IPv6 :443 sockets.
# Inherit those socket options, as the other virtual hosts do.
server {
    listen 80;
    listen [::]:80;
    server_name indiek.com www.indiek.com;
    access_log off;
    error_log /var/log/nginx/indiek.error.log warn;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }
    location / { return 301 https://indiek.com$request_uri; }
}

server {
    listen 443;
    listen [::]:443;
    server_name www.indiek.com;
    ssl_certificate /etc/letsencrypt/live/indiek.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/indiek.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    access_log off;
    error_log /var/log/nginx/indiek.error.log warn;
    return 301 https://indiek.com$request_uri;
}

server {
    listen 443;
    listen [::]:443;
    server_name indiek.com;
    root /projects/indiek/dist;
    index index.html;
    autoindex off;
    server_tokens off;

    ssl_certificate /etc/letsencrypt/live/indiek.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/indiek.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    access_log off;
    error_log /var/log/nginx/indiek.error.log warn;
    gzip_vary on;
    gzip_min_length 256;
    gzip_types text/css application/javascript application/json application/xml text/plain image/svg+xml;

    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;
    add_header Strict-Transport-Security "max-age=86400" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://matomo.lumejs.com https://www.youtube.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://matomo.lumejs.com; font-src 'self'; frame-src https://www.youtube-nocookie.com https://www.youtube.com; connect-src 'self' https://matomo.lumejs.com; object-src 'none'; base-uri 'self'; form-action 'none'; frame-ancestors 'none'; upgrade-insecure-requests" always;

    # Ubuntu's default mime.types does not include ES module .mjs files.
    location ~ \.mjs$ {
        types { application/javascript mjs; }
        try_files $uri =404;
    }
    location ~ /\. { deny all; }
    location / { try_files $uri $uri/ =404; }
}
